<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaf Check</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f2;color:#1d281d}.app{max-width:700px;margin:auto;padding:16px 14px 90px}header{background:#4c7a3d;color:#fff;padding:20px;border-radius:18px;margin-bottom:16px}h1{margin:0 0 6px}header p{margin:0}.card{background:#fff;padding:16px;border-radius:15px;margin:14px 0;box-shadow:0 2px 9px #0001}label{display:block;font-weight:bold;margin:9px 0 6px}select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;background:#fff;font-size:15px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;font-size:14px}.green{background:#4c7a3d;color:#fff}.orange{background:#e67e22;color:#fff}.gray{background:#e7e7e7}.full{width:100%;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{text-align:center}.thumb{width:100%;aspect-ratio:1;background:#edf0ec;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#777;font-size:12px;font-weight:bold;background-size:cover;background-position:center}.small{width:100%;padding:8px 4px;margin-top:6px;font-size:12px}.hint{font-size:13px;color:#666;line-height:1.5}.q{border-top:1px solid #eee;padding-top:10px;margin-top:10px}.result{background:#eef7ec;border-left:5px solid #4c7a3d}.hidden{display:none!important}#cameraArea{background:#111;padding:9px;border-radius:12px;margin-top:12px}#camera{width:100%;border-radius:9px;max-height:55vh;object-fit:cover}.camBtns{display:flex;gap:8px;margin-top:8px}.camBtns button{flex:1}.history{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#4c7a3d;color:#fff;font-size:22px;z-index:20;box-shadow:0 4px 12px #0004}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end}.modalBox{background:#fff;width:100%;max-width:700px;margin:auto;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}.item{padding:12px;border:1px solid #ddd;border-radius:9px;margin:8px 0}.item button{margin-top:7px}.footer{text-align:center;color:#777;font-size:12px;margin-top:20px}
</style></head><body><main class="app">
<header><h1>🌿 Leaf Check</h1><p>Check your crop for possible signs of disease.</p></header>
<section class="card"><label for="crop">1. Select your crop</label><select id="crop"><option value="">-- Choose a crop --</option><option>Tomato</option><option>Maize</option><option>Cassava</option><option>Pepper</option><option>Plantain</option></select></section>
<section class="card"><label>2. Add crop photos</label><p class="hint">A leaf photo is required. Stem and fruit photos are optional.</p><div class="grid">
<div class="photo"><div id="leaf" class="thumb">LEAF</div><button class="green small" onclick="camera('leaf')">📷 Take photo</button><button class="gray small" onclick="upload('leaf')">📁 Upload</button></div>
<div class="photo"><div id="stem" class="thumb">STEM</div><button class="green small" onclick="camera('stem')">📷 Take photo</button><button class="gray small" onclick="upload('stem')">📁 Upload</button></div>
<div class="photo"><div id="fruit" class="thumb">FRUIT</div><button class="green small" onclick="camera('fruit')">📷 Take photo</button><button class="gray small" onclick="upload('fruit')">📁 Upload</button></div></div>
<input id="file" type="file" accept="image/*" style="display:none"><div id="cameraArea" class="hidden"><video id="video" autoplay playsinline></video><div class="camBtns"><button class="orange" onclick="capture()">📸 Capture</button><button class="gray" onclick="closeCam()">Cancel</button></div><p style="color:#fff;font-size:12px">If camera does not open, use Upload.</p></div>
<button id="check" class="green full hidden" onclick="questions()">Check for Disease</button></section>
<section id="questions" class="card hidden"></section><section id="result" class="card result hidden"></section>
<section id="follow" class="card hidden"><h3>3. A few more questions</h3><label>How old is the crop?</label><input id="age" placeholder="Example: 6 weeks"><label>When did you first notice the problem?</label><input id="noticed" placeholder="Example: 5 days ago"><label>Has it spread to other plants?</label><select id="spread"><option value="">-- Select --</option><option>Yes</option><option>No</option><option>Not sure</option></select><label>How often do you water?</label><input id="water" placeholder="Example: Every 2 days"><label>Any fertilizer or pesticide used recently?</label><input id="chem" placeholder="Example: NPK fertilizer"><button class="green full" onclick="plan()">Get Action Plan</button></section>
<section id="action" class="card result hidden"></section><button class="gray full" onclick="resetApp()">Start New Check</button><div class="footer">Leaf Check is a symptom-based screening tool, not a laboratory diagnosis.</div></main>
<button class="history" onclick="toggleHistory()">🕘</button><div id="modal" class="modal hidden"><div class="modalBox"><button class="gray" onclick="toggleHistory()">Close</button><h2>📋 History</h2><div id="history"></div><button class="gray" onclick="clearHistory()">Clear History</button></div></div>
<script>
let slot=null,stream=null,photos={leaf:null,stem:null,fruit:null};
const qs={Tomato:[['spots','Are there spots on the leaves?',['Yes','No']],['rings','Do the spots have rings like a target pattern?',['Yes','No','Not sure']],['lower','Is it mostly the lower/older leaves affected?',['Yes','No']],['yellow','Are the leaves turning yellow?',['Yes','No']],['powder','Is there a white or powdery coating?',['Yes','No']]],Maize:[['stripes','Are there yellow or white stripes along the leaf veins?',['Yes','No']],['rust','Are there orange/rust-colored raised spots?',['Yes','No']],['stalk','Does the stalk feel soft or rotten near the base?',['Yes','No']],['whorl','Are there holes or chewed damage in young leaves?',['Yes','No']]],Cassava:[['mosaic','Do the leaves show a yellow-green mottled pattern?',['Yes','No']],['brown','Are there brown spots on the leaves?',['Yes','No']],['canker','Are there sunken or dark patches on the stem?',['Yes','No']],['whitefly','Do you see small white flying insects under the leaves?',['Yes','No']]],Pepper:[['curl','Are the leaves curling or twisting?',['Yes','No']],['halo','Do leaf spots have a yellow ring around them?',['Yes','No']],['wilt','Is the plant wilting even when soil is moist?',['Yes','No']],['fruitspots','Are there dark, sunken spots on the fruit?',['Yes','No']]],Plantain:[['streak','Are there dark streaks running along the leaves?',['Yes','No']],['yellowold','Are older leaves yellowing and dying from the edges?',['Yes','No']],['black','Are there black spots with yellow rings?',['Yes','No']],['fruitrot','Is there rot starting from the tip of the fruit?',['Yes','No']]]};
const $=id=>document.getElementById(id);
$('crop').onchange=()=>{$('check').classList.add('hidden');hide('questions');hide('result');hide('follow');hide('action')};
function upload(s){if(!$('crop').value)return alert('Please select a crop first.');slot=s;$('file').value='';$('file').click()}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Please select an image.');let r=new FileReader();r.onload=()=>setPhoto(slot,r.result);r.readAsDataURL(f)};
function setPhoto(s,d){photos[s]=d;$(s).style.backgroundImage='url("'+d+'")';$(s).textContent='';if(photos.leaf)$('check').classList.remove('hidden')}
async function camera(s){if(!$('crop').value)return alert('Please select a crop first.');slot=s;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert('Camera is unavailable here. Please use Upload instead.');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;show('cameraArea')}catch(e){alert('Camera could not be opened. Please use Upload instead.')}}
function capture(){let v=$('video');if(!v.videoWidth)return alert('Camera is still loading. Try again in a moment.');let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);setPhoto(slot,c.toDataURL('image/jpeg',.85));closeCam()}
function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;hide('cameraArea')}
function questions(){if(!$('crop').value)return alert('Please select a crop first.');if(!photos.leaf)return alert('Please add a leaf photo first.');let c=$('crop').value,h='<h3>🔎 What are you seeing?</h3><p class="hint">Answer every question to get a possible result.</p>';qs[c].forEach((q,i)=>{h+='<div class="q"><label>'+(i+1)+'. '+q[1]+'</label><select id="q_'+q[0]+'"><option value="">-- Select --</option>'+q[2].map(x=>'<option>'+x+'</option>').join('')+'</select></div>'});h+='<button class="green full" onclick="diagnose()">Get Diagnosis</button>';$('questions').innerHTML=h;show('questions');$('questions').scrollIntoView({behavior:'smooth'})}
function diagnose(){let c=$('crop').value,a={};for(let q of qs[c]){let v=$('q_'+q[0]).value;if(!v)return alert('Please answer all the questions.');a[q[0]]=v}let d=getDx(c,a);$('result').innerHTML='<h3>🌱 Possible result</h3><h2>'+d.n+'</h2><p>'+d.d+'</p><p class="hint"><b>Important:</b> This is a screening result, not a confirmed diagnosis.</p>';show('result');show('follow');save({crop:c,name:d.n,desc:d.d,date:new Date().toLocaleString()});$('result').scrollIntoView({behavior:'smooth'})}
function getDx(c,a){if(c==='Tomato'){if(a.spots==='Yes'&&a.rings==='Yes'&&a.lower==='Yes')return D('Possible Early Blight','Dark spots with ring patterns on older leaves can be associated with early blight.');if(a.powder==='Yes')return D('Possible Powdery Mildew','A white or powdery coating can be associated with powdery mildew.');if(a.yellow==='Yes'&&a.spots==='No')return D('Possible Nutrient Deficiency','Yellowing without spots can be associated with a nutrient problem.');if(a.spots==='Yes')return D('Possible Leaf Spot Disease','Leaf spots are present but do not clearly match one specific pattern.')}if(c==='Maize'){if(a.stripes==='Yes')return D('Possible Maize Streak Virus','Yellow or white streaks along maize leaves can be associated with maize streak virus.');if(a.rust==='Yes')return D('Possible Common Rust','Orange/rust-colored raised spots can be associated with common rust.');if(a.stalk==='Yes')return D('Possible Stalk Rot','A soft or rotten stalk base can be associated with stalk rot.');if(a.whorl==='Yes')return D('Possible Fall Armyworm Damage','Chewed holes in young leaves can be associated with fall armyworm feeding.')}if(c==='Cassava'){if(a.mosaic==='Yes'&&a.whitefly==='Yes')return D('Possible Cassava Mosaic Disease','Yellow-green mottling with whiteflies can be associated with cassava mosaic disease.');if(a.brown==='Yes')return D('Possible Cassava Brown Leaf Spot','Brown leaf spots can be associated with cassava brown leaf spot.');if(a.canker==='Yes')return D('Possible Cassava Bacterial Blight','Dark or sunken stem patches can be associated with bacterial disease.')}if(c==='Pepper'){if(a.curl==='Yes')return D('Possible Pepper Leaf Curl Virus','Curling or twisting leaves can be associated with leaf curl virus and other problems.');if(a.halo==='Yes')return D('Possible Bacterial Leaf Spot','Spots with yellow halos can be associated with bacterial leaf spot.');if(a.wilt==='Yes')return D('Possible Vascular Wilt','Wilting despite moist soil can be associated with vascular wilt.');if(a.fruitspots==='Yes')return D('Possible Anthracnose','Dark, sunken fruit spots can be associated with anthracnose.')}if(c==='Plantain'){if(a.streak==='Yes')return D('Possible Banana Streak Virus','Dark streaks can be associated with banana streak virus.');if(a.black==='Yes')return D('Possible Black Sigatoka','Dark leaf spots with yellowing can be associated with black Sigatoka.');if(a.yellowold==='Yes')return D('Possible Fusarium Wilt','Yellowing and death of older leaves can be associated with Fusarium wilt.');if(a.fruitrot==='Yes')return D('Possible Crown/Tip Rot','Fruit rot can have several causes and needs close examination.')}return D('No Clear Match','The answers do not strongly match one of the patterns in this version of Leaf Check.')}function D(n,d){return{n:n,d:d}}
function plan(){let c=$('crop').value;if(!c)return alert('Please select a crop first.');let esc=x=>String(x||'not specified').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));$('action').innerHTML='<h3>🌿 Your Action Plan</h3><p><b>Crop:</b> '+esc(c)+'<br><b>Age:</b> '+esc($('age').value)+'<br><b>First noticed:</b> '+esc($('noticed').value)+'<br><b>Spread:</b> '+esc($('spread').value)+'<br><b>Watering:</b> '+esc($('water').value)+'<br><b>Recent chemicals:</b> '+esc($('chem').value)+'</p><ol><li>Remove severely affected plant material where practical.</li><li>Clean tools after working on affected plants.</li><li>Avoid unnecessary overhead watering.</li><li>Keep the crop area clean and reasonably well ventilated.</li><li>If using a pesticide/fungicide, use only one registered for the crop and follow its label.</li><li>Check again in 5–7 days to see whether symptoms are spreading.</li></ol><p class="hint">For severe or rapidly spreading symptoms, contact a local agricultural extension or plant-health professional.</p>';show('action');$('action').scrollIntoView({behavior:'smooth'})}
function save(x){let h=JSON.parse(localStorage.getItem('leaf_history')||'[]');h.unshift(x);localStorage.setItem('leaf_history',JSON.stringify(h.slice(0,20)))}
function toggleHistory(){let m=$('modal');m.classList.toggle('hidden');if(!m.classList.contains('hidden'))renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem('leaf_history')||'[]');$('history').innerHTML=h.length?h.map((x,i)=>'<div class="item"><b>'+x.crop+'</b><br>'+x.name+'<br><small>'+x.date+'</small><br><button class="gray" onclick="detail('+i+')">View</button></div>').join(''):'<p class="hint">No checks saved yet.</p>'}
function detail(i){let h=JSON.parse(localStorage.getItem('leaf_history')||'[]'),x=h[i];$('history').innerHTML='<button class="gray" onclick="renderHistory()">← Back</button><div class="card result"><h3>'+x.crop+'</h3><h2>'+x.name+'</h2><p>'+x.desc+'</p><small>'+x.date+'</small></div>'}
function clearHistory(){if(confirm('Clear all history?')){localStorage.removeItem('leaf_history');renderHistory()}}
function resetApp(){closeCam();photos={leaf:null,stem:null,fruit:null};['leaf','stem','fruit'].forEach(s=>{$(s).style.backgroundImage='';$(s).textContent=s.toUpperCase()});$('crop').value='';['check','questions','result','follow','action'].forEach(hide);['age','noticed','water','chem'].forEach(x=>$(x).value='');$('spread').value='';scrollTo({top:0,behavior:'smooth'})}
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
window.onbeforeunload=closeCam;
</script>
</body>
</html>
